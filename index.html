<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div id="display">0</div>
        <div class="button">
            <button class="grey" onclick="ClearAll()">AC</button>
            <button class="grey" onclick="percentage()">%</button>
            <button class="grey" onclick="Clear()">⌫</button>
            <button class="orange" onclick="SetOperator('/')">÷</button>
            <button class="grey" onclick="SetNumber('7')">7</button>
            <button class="grey" onclick="SetNumber('8')">8</button>
            <button class="grey" onclick="SetNumber('9')">9</button>
            <button class="orange" onclick="SetOperator('*')">×</button>
            <button class="grey" onclick="SetNumber('4')">4</button>
            <button class="grey" onclick="SetNumber('5')">5</button>
            <button class="grey" onclick="SetNumber('6')">6</button>
            <button class="orange" onclick="SetOperator('-')">−</button>
            <button class="grey" onclick="SetNumber('1')">1</button>
            <button class="grey" onclick="SetNumber('2')">2</button>
            <button class="grey" onclick="SetNumber('3')">3</button>
            <button class="orange" onclick="SetOperator('+')">+</button>
            <button class="grey" id="zero-button" onclick="SetNumber('0')">0</button>
            <button class="grey" onclick="SetNumber('.')">.</button>
            <button class="orange" onclick="Calculate()">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
